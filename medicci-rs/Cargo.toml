[package]
name = "medicci"
version = "0.1.0"
edition = "2021"
description = "Lector de historia clínica: burbuja flotante y chat, encima del HCE"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11"] }
egui = "0.29"
rusqlite = { version = "0.31.0", features = ["bundled"] }
regex = "1.10.4"
# Medicci conectada al servidor de Medicci, esté donde esté: http o https, sin async
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
serde_json = "1"
# dictado: el micrófono, solo mientras se mantiene pulsado el botón (src/voz.rs)
cpal = "0.18"

[profile.release]
opt-level = 2
strip = true
