<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCIS · Agenda de consultas externas</title>
<style>
/* Réplica de HCIS para los pacientes de los CSV sintéticos, con la misma
   pantalla que demo/web/hcis.html (sacada de una captura real): cinta de
   paciente, barra de iconos, columna verde (Alertas · Historia Clínica ·
   Relevante), pestañas con estetoscopio y el formulario en fieldsets con la
   leyenda sobre el borde. Hace de «HCIS»: no sabe nada de Medicci. Pone el
   NHC del paciente abierto en el título de la ventana, como HCIS. */
:root{
  --verde:#009b6b; --gris:#ececec; --borde:#c6c6c6; --rojo:#cc0000; --azul:#1a4fa0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--gris);color:#000;font:12px/1.3 Verdana,Tahoma,Arial,sans-serif}
button,input,select,textarea{font-family:Verdana,Tahoma,Arial,sans-serif;font-size:12px;color:inherit}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}

/* ---------- cinta del paciente ---------- */
.cinta{background:#fff;padding:2px 8px 3px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;
  font-size:12px;font-weight:bold;border-bottom:1px solid #ddd;min-height:27px}
.cinta .epi{color:#2a6ebb}
.cinta .fin{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:bold}
.cinta select{font-weight:normal;font-size:11px;max-width:260px}
.cinta .alerta{background:#d40000;border-radius:4px;width:30px;height:21px;display:flex;align-items:center;justify-content:center}
.cinta .alerta span{width:13px;height:13px;border:2px solid #fff;border-radius:50%}

/* ---------- barra de iconos ---------- */
.iconos{background:#fff;border-bottom:1px solid var(--borde);padding:2px 6px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.iconos .i{width:19px;height:18px;display:inline-block;cursor:pointer;border-radius:2px}
.iconos .sep{width:1px;height:18px;background:#bbb;margin:0 4px}
.iconos .fin{margin-left:auto;display:flex;gap:6px;align-items:center}
.iconos .usuario{font-size:11px;color:#333;margin-right:6px}

.marco{display:grid;grid-template-columns:286px minmax(0,1fr);min-height:0;background:var(--gris)}

/* ---------- columna izquierda ---------- */
.izq{background:#fff;border-right:1px solid var(--borde);overflow:auto;min-height:0}
.verde{background:var(--verde);color:#fff;font-weight:bold;font-size:12px;padding:5px 9px;display:flex;align-items:center;gap:8px}
.verde .circ{width:15px;height:15px;border-radius:50%;background:#047a55;color:#fff;font-size:10px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.verde .fin{margin-left:auto;display:flex;align-items:center;gap:6px}
.tri-av{color:#f5c518;font-size:13px}
.embudo{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:11px solid #f5c518}
.menos{width:15px;height:15px;border-radius:50%;background:#fff;color:var(--verde);display:flex;align-items:center;justify-content:center;font-weight:bold}
.alertas{min-height:18px;padding:4px 9px;border-bottom:1px solid #e3e3e3}
.cab-hc{display:flex;align-items:center;gap:6px;padding:6px 6px 4px}
.cab-hc .q{width:15px;height:15px;background:#2a6ebb;color:#fff;font-weight:bold;font-size:10px;
  display:flex;align-items:center;justify-content:center;border-radius:2px}
.cab-hc .cuad{width:34px;height:15px;border:1px solid #c6c6c6;background:#fff}
.arbol{padding:0 4px 8px;font-size:11.5px}
.nodo{display:block;width:100%;background:none;border:0;text-align:left;
  padding:1px 2px;cursor:pointer;line-height:1.45;font-size:11.5px}
.nodo > span{margin-right:4px;vertical-align:-1px}
.nodo:hover{background:#eef7f3}
.mas{display:inline-block;width:11px;height:11px;border:1px solid #9a9a9a;background:#fff;font:10px/9px monospace;text-align:center}
.icR{display:inline-block;width:15px;height:14px;background:#fff;border:1px solid #d03a3a;color:#cc0000;
  font:bold 11px/12px Georgia,"Times New Roman",serif;text-align:center}
.bang{display:inline-block;color:#e8a200;font-weight:bold;font-size:13px;width:6px;text-align:center}
.relev{padding:0 0 8px}
.relev .tabs{display:flex;gap:1px}
.relev .tabs span{width:48px;height:28px;border:1px solid #c6c6c6;background:#fafafa;display:flex;
  align-items:center;justify-content:center;font-size:15px}
.relev .tabs span.sel{background:#5d4a66}
.relev .it{display:flex;gap:7px;align-items:center;padding:4px 8px;cursor:pointer}
.relev .it:nth-child(even){background:#f4f4f4}
.relev .it:hover{background:#eef7f3}
.relev .carp{width:16px;height:12px;flex:0 0 auto}
.relev .brot{width:14px;height:13px;flex:0 0 auto}
.relev .tx{color:#0a6b4a;font-size:11.5px;font-weight:bold}

/* ---------- zona derecha ---------- */
.der{display:flex;flex-direction:column;min-height:0;background:var(--gris)}
.pest{display:flex;align-items:flex-end;gap:3px;padding:3px 6px 0;background:var(--gris)}
.pest button{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--borde);
  border-bottom:0;border-radius:10px 10px 0 0;padding:5px 16px;cursor:pointer;color:var(--azul);
  text-decoration:underline;font-size:12px}
.pest button[aria-selected="true"]{color:#000;text-decoration:none;font-weight:bold;padding-bottom:6px}
.pest .este{width:13px;height:13px;border:1.5px solid #333;border-top:0;border-right:0;border-radius:0 0 0 8px;flex:0 0 auto;position:relative}
.pest .este::after{content:"";position:absolute;right:-4px;bottom:-2px;width:5px;height:5px;border-radius:50%;background:#2a6ebb}

.hoja{flex:1;min-height:0;overflow:auto;background:#fff;border-top:1px solid var(--borde);padding:6px 12px 14px}
.titulo{display:flex;align-items:center;gap:9px;font-weight:bold;font-size:13px;margin:6px 0 12px;letter-spacing:.01em}
.ham{width:26px;height:22px;border:1px solid #adadad;border-radius:3px;background:#f0f0f0;
  display:flex;flex-direction:column;justify-content:center;gap:3px;padding:4px;flex:0 0 auto}
.ham i{height:2px;background:#666;display:block}

/* fieldsets con la leyenda sobre el borde */
fieldset{border:1px solid #d7d7d7;border-radius:9px;margin:0 0 13px;padding:9px 14px 14px;background:#fff}
legend{padding:0 6px;font-size:11.5px;color:#333;display:flex;align-items:center;gap:6px;cursor:pointer}
legend .t{color:var(--verde);font-size:10px}
legend.rojo{color:var(--rojo)}
fieldset.plegada{padding:0;min-height:0}
fieldset.plegada .con{display:none}
.rej{display:grid;grid-template-columns:max-content minmax(140px,1fr) max-content minmax(140px,1fr);gap:7px 10px;align-items:start}
.rej .et{font-size:11.5px;padding-top:3px}
.rej .et.rojo{color:var(--rojo)}
.campo{border:1px solid #d2d2d2;border-radius:9px;background:#efefef;color:#8d8d8d;padding:3px 9px;min-height:21px;font-size:11.5px}
select.campo{color:#000;background:#fff;border-radius:3px;border-color:#8a8a8a;padding:2px 4px}

/* cajas de texto con sus iconitos */
.caja{position:relative;margin-top:2px}
.caja .txt{border:1px solid #8a8a8a;background:#fff;padding:5px 8px;min-height:72px;max-height:260px;overflow:auto;
  font:11.5px/1.5 "Courier New",monospace;white-space:pre-wrap}
.caja .arriba{position:absolute;top:3px;right:5px;display:flex;gap:4px}
.caja .abajo{display:flex;gap:5px;padding:3px 1px 0}
.ic{width:15px;height:14px;display:inline-block;border:1px solid #9a9a9a;background:#f3f3f3;flex:0 0 auto}
.ic.az{background:#cfe3f7;border-color:#6f9fd0}
.ic.vd{background:#cfe9d6;border-color:#6fae84}
.ic.am{background:#faeec2;border-color:#cbae55}
.ic.x{border:0;background:none;color:#c00;font-weight:bold;text-align:center;line-height:13px;font-size:13px}
.ic.flecha{border:0;background:none;color:#222;font-size:11px;line-height:13px}

/* motivo de consulta: una línea con la R roja */
.linea-motivo{display:flex;align-items:center;gap:8px}
.icr{width:19px;height:19px;border:1px solid #c33;background:#fff;color:#c00;font:bold 13px/17px Georgia,serif;text-align:center;flex:0 0 auto}
.linea-motivo .campo{flex:1;background:#fff;color:#000;border:1px solid #555;border-radius:2px;min-height:23px;padding:3px 7px}
.bajo-motivo{display:flex;gap:7px;padding:4px 0 0 28px;align-items:center}
.lupa{width:13px;height:13px;border:2px solid #2a6ebb;border-radius:50%;position:relative}
.lupa::after{content:"";position:absolute;right:-4px;bottom:-3px;width:6px;height:2px;background:#2a6ebb;transform:rotate(45deg)}

.btns{display:flex;gap:5px;flex-wrap:wrap}
.btn{background:#f0f0f0;border:1px solid #adadad;border-radius:3px;padding:3px 10px;cursor:pointer;font-size:11.5px}
.btn:hover{background:#e3e3e3}
.ctes{margin-top:8px;font-size:11.5px;color:#555}

/* peticiones */
.pet-cab{display:flex;align-items:flex-end;gap:6px;margin-bottom:-1px}
.pet-cab .sel{border:1px solid #8a8a8a;border-radius:9px 9px 0 0;background:#fff;padding:6px 14px;min-width:210px}
.pet-cab .nuevo{border:1px solid #c6c6c6;border-bottom:0;border-radius:9px 9px 0 0;background:#f6f6f6;padding:6px 12px}
.pet-cab .iconos-pet{display:flex;gap:6px;margin-left:10px;padding-bottom:4px}
.pet-cab .iconos-pet span{width:19px;height:19px;border:1px solid #a33;background:#e74c3c;border-radius:2px}
.favoritos{border:1px solid #8a8a8a;background:#fff;padding:9px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 18px;font-size:11.5px}

/* tablas de la historia y de la agenda */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{background:#efefef;border:1px solid #d7d7d7;padding:3px 6px;text-align:left;font-weight:bold;color:#333;white-space:nowrap}
td{border:1px solid #e3e3e3;padding:3px 6px;vertical-align:top}
tr:nth-child(even) td{background:#fafafa}
td.r{color:#999;font-family:"Courier New",monospace;width:34px}
td .obs{display:block;margin-top:2px;color:#444;font:11px/1.45 "Courier New",monospace}
tr.sena td{background:#fff4c2}

/* informes clínicos, como en demo/web/hcis.html */
.doc{border:1px solid #d7d7d7;margin-bottom:9px;background:#fff}
.doc .cab{background:#f1f6f4;border-bottom:1px solid #e0e0e0;padding:4px 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:11.5px}
.doc .cab .t{font-weight:bold}
.doc .cab .s,.doc .cab .a{color:#555}
.doc .cab .a{margin-left:auto}
.doc pre{margin:0;padding:7px 10px 10px;white-space:pre-wrap;font:11.5px/1.5 "Courier New",monospace}
.doc.sena{box-shadow:inset 3px 0 0 var(--verde)}
.agenda tr{cursor:pointer}
.agenda tr:hover td{background:#eef7f3}
.agenda td.h{color:#2a6ebb;font-weight:bold;width:52px}
.vacia{color:#888}

.pie{background:var(--gris);border-top:1px solid var(--borde);padding:6px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.pie button{background:#7a3268;border:1px solid #5d2550;color:#fff;border-radius:3px;padding:4px 18px;cursor:pointer;font-size:11.5px}
.pie button:hover{background:#8d3b78}

@media (max-width:1000px){
  .app{height:auto}
  .marco{grid-template-columns:1fr}
  .izq{max-height:40vh}
  .rej{grid-template-columns:max-content 1fr}
}
</style>
</head>
<body>
<div class="app">

  <div class="cinta">
    <span class="nhc" id="c-nhc"></span>
    <span id="c-nombre"></span>
    <span id="c-datos"></span>
    <span id="c-episodio"></span>
    <span class="fin">
      <select id="sel-pac" aria-label="Agenda de hoy"></select>
      <span class="alerta" id="c-alerta" title="Alertas" hidden><span></span></span>
    </span>
  </div>

  <div class="iconos">
    <span class="i" style="background:#b7c9e2"></span>
    <span class="i" style="background:#9fd3a8"></span>
    <span class="i" style="background:#9fb8d3"></span>
    <span class="sep"></span>
    <span class="i" style="background:#e8dcc0"></span>
    <span class="i" style="background:#cfd9e8"></span>
    <span class="i" style="background:#cbd8e6"></span>
    <span class="sep"></span>
    <span class="i" style="background:#8fd0a5"></span>
    <span class="i" style="background:#f3d98b"></span>
    <span class="sep"></span>
    <span class="i" style="background:#f6e08a"></span>
    <span class="i" style="background:#a9d9b4"></span>
    <span class="i" style="background:#d6d6d6"></span>
    <span class="i" style="background:#c3d4e8"></span>
    <span class="i" style="background:#e3b9b9"></span>
    <span class="i" style="background:#a8d7cf"></span>
    <span class="i" style="width:38px;background:#e8f3e4;border:1px solid #7aa87a;font:bold 10px/16px Verdana;text-align:center;color:#2a6b2a">AT</span>
    <span class="fin">
      <span class="usuario">Usuario: <b id="c-medico">med.demo01</b></span>
      <span class="i" style="background:#f4d98c"></span>
      <span class="i" style="background:#e0a0a0"></span>
      <span class="i" style="background:#b9c9e4"></span>
      <span class="i" style="background:#cfd9e8"></span>
    </span>
  </div>

  <div class="marco">

    <aside class="izq">
      <div class="verde"><span class="circ">‹</span>Alertas <span class="tri-av">⚠</span></div>
      <div class="alertas" id="alertas"></div>

      <div class="verde">Historia Clínica <span class="fin"><span class="embudo"></span></span></div>
      <div class="cab-hc"><span class="cuad"></span><span class="q">?</span>
        <svg width="17" height="15" viewBox="0 0 17 15" aria-hidden="true">
          <rect x="0.5" y="2.5" width="12" height="11" fill="#f3e6c8" stroke="#8a7a52"/>
          <path d="M2.5 5.5h8M2.5 8h8M2.5 10.5h5" stroke="#8a7a52"/>
          <path d="M9 11.5l5.5-6 2 1.7-5.5 6-2.6.9z" fill="#2f7d32" stroke="#1d5a20"/>
        </svg><b>Historia Clínica</b></div>
      <div class="arbol" id="arbol"></div>

      <div class="verde">Relevante <span class="fin"><span class="menos">−</span></span></div>
      <div class="relev">
        <div class="tabs">
          <span class="sel" title="Antecedentes">🌍</span><span title="Alergias">✳</span>
          <span title="Hábitos">⊘</span><span title="Familiares">👥</span><span title="Documentos">📂</span>
        </div>
        <div id="relevante"></div>
      </div>
    </aside>

    <section class="der">
      <div class="pest" id="pestanas">
        <button data-v="consulta" aria-selected="true"><span class="este"></span>Consulta</button>
        <button data-v="historia" aria-selected="false"><span class="este"></span>Historia Clínica</button>
        <button data-v="monograficos" aria-selected="false"><span class="este"></span>Monográficos</button>
        <button data-v="pedidos" aria-selected="false"><span class="este"></span>Pedidos Recientes</button>
        <button data-v="preoperatorio" aria-selected="false">Preoperatorio</button>
        <button data-v="prescripcion" aria-selected="false"><span class="este"></span>Prescripción</button>
        <button data-v="mas" aria-selected="false">…</button>
      </div>

      <div class="hoja" id="hoja"></div>

      <div class="pie">
        <button>Guardar</button><button>Guardar y salir</button>
        <button>Salir</button><button>Generar Informe</button>
      </div>
    </section>

  </div>
</div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const HOY = new Date().toLocaleDateString("es-ES", {day: "2-digit", month: "2-digit", year: "numeric"});

/* ---------- cómo escribe HCIS cada dato ---------- */
const fecha = v => { if (!v) return ""; const [d] = String(v).split(" "); const [a, m, dd] = d.split("-"); return dd ? `${dd}/${m}/${a}` : String(v); };
const hora = v => v ? String(v).slice(0, 5) : "";
const MAYUS = v => String(v ?? "").replaceAll("_", " ").toUpperCase();
const apellidos = nombre => { const p = nombre.split(" "); return (p.slice(1).join(" ") + ", " + p[0]).toUpperCase(); };
const COLUMNAS = {
  PACIENTES: [["Edad", c => `${c.edad} años`], ["Sexo", c => c.sexo === "F" ? "Mujer" : "Varón"],
    ["Contacto preferido", c => esc(MAYUS(c.contacto))], ["Accesibilidad", c => esc(MAYUS(c.accesibilidad))]],
  DERIVACIONES_AP: [["Fecha", c => fecha(c.fecha)], ["Destino", c => esc(MAYUS(c.servicio || c.especialidad))],
    ["Prioridad", c => esc(MAYUS(c.prioridad))],
    ["Motivo", c => esc(c.motivo) + (c.observaciones ? `<span class="obs">${esc(c.observaciones)}</span>` : "")],
    ["Estado", c => esc(MAYUS(c.estado))]],
  CITAS: [["Fecha", c => fecha(c.fecha)], ["Hora", c => hora(c.hora)], ["Servicio", c => esc(MAYUS(c.servicio || c.especialidad))],
    ["Visita", c => ({P: "PRIMERA", S: "SUCESIVA"}[c.tipo_visita] || esc(MAYUS(c.tipo_visita)))],
    ["Prioridad", c => esc(MAYUS(c.prioridad))], ["Estado", c => esc(MAYUS(c.estado))]],
  MOVIMIENTOS_CITAS: [["Fecha", c => fecha(c.fecha)], ["Cita", c => esc(c.cita)], ["Movimiento", c => esc(MAYUS(c.tipo))],
    ["Motivo", c => esc(MAYUS(c.motivo))]],
  PRUEBAS: [["Prueba", c => esc(MAYUS(c.tipo))], ["Programada", c => fecha(c.programada)], ["Realizada", c => fecha(c.realizada)],
    ["Estado", c => esc(MAYUS(c.estado))], ["Resultado", c => c.resultado ? "DISPONIBLE" : ""]],
  COMUNICACIONES: [["Fecha", c => fecha(c.fecha)], ["Canal", c => esc(MAYUS(c.canal))], ["Aviso", c => esc(MAYUS(c.motivo))],
    ["Cita", c => esc(c.cita)], ["Entrega", c => esc(MAYUS(c.resultado))], ["Respuesta", c => esc(MAYUS(c.respuesta))]]
};
const SECCIONES = [["PACIENTES", "Datos administrativos del paciente"], ["DERIVACIONES_AP", "Interconsultas de Atención Primaria"],
  ["CITAS", "Citas"], ["MOVIMIENTOS_CITAS", "Movimientos de citas"], ["PRUEBAS", "Pruebas"], ["COMUNICACIONES", "Comunicaciones al paciente"]];
const FAVORITOS = ["Peticion de Hemograma","Perfil General Bioquimica","Perfil Sedimento-Tira Orina",
 "Petición a Radiología","Petición a Radiología Urgente","Petición a AP",
 "Petición a B. Sangre","Petición a HdD Médico","Petición a HdD Alergia",
 "Petición a HdD Psiquiátrico","Petición a HdD Oncológico","RX + Anestesia fuera Quirófano (NO_INGRESADOS)"];
const IMAGEN = /RADIOGRAF|ECOGRAF|TAC|RESONANCIA|MAMOGRAF|DENSITOMETR|RX/;
const LABORATORIO = /ANALIT|HEMOGRAM|BIOQUIM|ORINA|SANGRE|LABORATORIO|PERFIL/;

/* ---------- piezas de la pantalla ---------- */
const herrArriba = `<div class="arriba"><span class="ic az"></span><span class="ic vd"></span>
  <span class="ic flecha">◀</span><span class="ic vd"></span></div>`;
const herrAbajo = `<div class="abajo"><span class="ic az"></span><span class="ic am"></span>
  <span class="ic" style="background:#d9d2ec"></span><span class="ic x">✕</span></div>`;
const caja = (txt, alto) => `<div class="caja"><div class="txt" style="min-height:${alto || 72}px">${esc(txt)}</div>
  ${herrArriba}</div>${herrAbajo}`;
const fs = (leyenda, con, o = {}) => `<fieldset class="${o.plegada ? "plegada" : ""}">
    <legend class="${o.rojo ? "rojo" : ""}"><span class="t">${o.plegada ? "▼" : "▲"}</span>${esc(leyenda)}</legend>
    <div class="con">${con}</div></fieldset>`;
const titulo = t => `<div class="titulo"><span class="ham"><i></i><i></i><i></i></span>${esc(t)}</div>`;
const tabla = (t, filas) => `<table><tr><th></th>${COLUMNAS[t].map(([n]) => `<th>${n}</th>`).join("")}</tr>${filas.map(f =>
  `<tr id="fila-${f.ref}"><td class="r">${f.ref}</td>${COLUMNAS[t].map(([, v]) => `<td>${v(f.campos)}</td>`).join("")}</tr>`).join("")}</table>`;

/* ---------- estado ---------- */
let agenda = [];                 // la agenda de hoy (la usa también la simulación)
let abierto = null, filas = [], pintado = "", vista = "consulta";
const de = t => filas.filter(f => f.tabla === t);
const ultima = t => de(t).slice().sort((a, b) => String(b.campos.fecha).localeCompare(String(a.campos.fecha)))[0];
function servicio(){
  const hoy = de("CITAS").find(f => fecha(f.campos.fecha) === HOY);
  const c = (hoy || ultima("CITAS") || ultima("DERIVACIONES_AP") || {campos: {}}).campos;
  return MAYUS(c.servicio || c.especialidad || "CONSULTAS EXTERNAS");
}

/* ---------- agenda ---------- */
function pintaAgenda(){
  return titulo(`AGENDA DE CONSULTAS EXTERNAS · ${HOY}`) + fs("Pacientes citados:", agenda.length
    ? `<table class="agenda"><tr><th>Hora</th><th>NHC</th><th>Paciente</th><th>Sexo</th><th>Edad</th><th>Prestación</th></tr>${agenda.map(p =>
      `<tr data-nhc="${esc(p.nhc)}"><td class="h">${esc(p.hora)}</td><td>${esc(p.nhc)}</td><td>${esc(apellidos(p.nombre))}</td>
        <td>${p.sexo === "F" ? "M" : "V"}</td><td>${esc(p.edad)}</td><td>${p.cronico ? "SUCESIVA" : "PRIMERA"}</td></tr>`).join("")}</table>`
    : `<div class="vacia">Esperando la agenda de HCIS…</div>`);
}
function pintaSelector(){
  const sel = $("#sel-pac"), actual = abierto ? abierto.nhc : "";
  sel.innerHTML = `<option value="">— Agenda del día —</option>` + agenda.map(p =>
    `<option value="${esc(p.nhc)}">${esc(p.hora)} · ${esc(apellidos(p.nombre))}</option>`).join("");
  sel.value = actual;
}
async function cargaAgenda(){
  const nueva = await fetch("/api/hcis/agenda").then(r => r.json()).catch(() => null);
  if (!nueva || JSON.stringify(nueva) === JSON.stringify(agenda)) return;
  agenda = nueva;
  pintaSelector();
  if (!abierto) pinta();
}

/* ---------- paciente ---------- */
async function abrePaciente(p){
  if (!p) return;
  abierto = p; filas = []; pintado = ""; vista = "consulta";
  $("#c-nhc").textContent = p.nhc;
  $("#c-nombre").textContent = apellidos(p.nombre);
  $("#c-datos").textContent = `${p.sexo === "F" ? "Mujer" : "Varón"}, ${p.edad} años`;
  $("#c-episodio").innerHTML = `Episodio: <span class="epi">CEX</span> ${HOY}`;
  // como HCIS: el paciente abierto, en el título de la ventana (la burbuja lo lee de ahí)
  document.title = `HCIS · ${p.nhc} · ${p.nombre.toUpperCase()}`;
  $("#sel-pac").value = p.nhc;
  pintaLado(); pinta();
  await cargaHistoria();
}
function cierraPaciente(){
  abierto = null; filas = []; pintado = ""; vista = "consulta";
  ["#c-nhc", "#c-nombre", "#c-datos", "#c-episodio"].forEach(s => $(s).textContent = "");
  document.title = "HCIS · Agenda de consultas externas";
  $("#sel-pac").value = "";
  pintaLado(); pinta();
}
async function cargaHistoria(){
  const p = abierto; if (!p) return;
  const r = await fetch(`/api/hcis/paciente/${encodeURIComponent(p.nhc)}`).then(r => r.json()).catch(() => null);
  if (p !== abierto || !r || !r.filas) return;
  const clave = JSON.stringify(r.filas);
  if (clave === pintado) return;
  pintado = clave; filas = r.filas;
  const h = $("#hoja"), arriba = h.scrollTop;
  pintaLado(); pinta(); h.scrollTop = arriba;   // con HL7 la historia cambia sola: sin saltar arriba
}

/* ---------- columna izquierda ---------- */
function pintaLado(){
  $("#alertas").innerHTML = "";
  $("#arbol").innerHTML = de("DERIVACIONES_AP").slice().reverse().map(f =>
    `<button class="nodo" data-ref="${f.ref}"><span class="mas">+</span><span class="icR">R.</span><span class="bang">!</span>${
      esc(MAYUS(f.campos.motivo))} ${fecha(f.campos.fecha)}</button>`).join("");
  const proximas = de("CITAS").filter(f => /CITADA|PROGRAMADA|PENDIENTE/.test(String(f.campos.estado))).slice(-4);
  $("#relevante").innerHTML = proximas.map(f =>
    `<div class="it" data-ref="${f.ref}">
      <svg class="carp" viewBox="0 0 16 12" aria-hidden="true"><path d="M0.5 11.5v-9h5l1.4 1.6h8.6v7.4z" fill="#f6d77a" stroke="#b08a1e"/><path d="M0.5 11.5l2.4-6h13l-2.4 6z" fill="#fbe9ae" stroke="#b08a1e"/></svg>
      <svg class="brot" viewBox="0 0 14 13" aria-hidden="true"><circle cx="4.5" cy="4.5" r="3.4" fill="#4cae4f"/><circle cx="9" cy="4" r="3" fill="#3f9c43"/><circle cx="7" cy="7.5" r="3.2" fill="#55b85a"/><path d="M7 9.5v3" stroke="#2e7d32" stroke-width="1.6"/></svg>
      <span class="tx">Cita ${fecha(f.campos.fecha)} ${hora(f.campos.hora)} · ${esc(f.campos.servicio || f.campos.especialidad)}</span></div>`).join("");
}
document.querySelector(".izq").onclick = e => { const b = e.target.closest("[data-ref]"); if (b) iraFila(b.dataset.ref); };

/* ---------- pestañas ---------- */
function pintaConsulta(){
  const serv = servicio(), d = ultima("DERIVACIONES_AP"), dc = d ? d.campos : {};
  const pruebas = de("PRUEBAS").map(f => f.campos);
  const linea = c => `${MAYUS(c.tipo)} · programada ${fecha(c.programada) || "—"}${c.realizada ? ` · realizada ${fecha(c.realizada)}` : ""} · ${MAYUS(c.estado)}${c.resultado ? " · RESULTADO DISPONIBLE" : ""}`;
  const citas = de("CITAS").map(f => f.campos.fecha).filter(Boolean).sort();
  return titulo(`PANTALLA HISTORIA CLÍNICA DE ${serv}`) +
  fs("Datos generales:", `<div class="rej">
      <span class="et">Informe:</span><div class="campo"></div>
      <span class="et">Tipo de documento:</span><div class="campo">Pantalla Historia Clínica de ${esc(serv)}</div>
      <span class="et">Especialidades:</span><div class="campo">${esc(serv)}</div>
      <span class="et rojo">Sección:</span><select class="campo"><option></option><option selected>CONSULTAS EXTERNAS</option></select>
      <span class="et rojo">Procedencia:</span><div class="campo">${d ? "ATENCIÓN PRIMARIA" : ""}</div>
      <span class="et rojo">Sit. Emergentes:</span><select class="campo"><option>-- Seleccionar --</option></select>
    </div>`) +
  fs("Otras Visitas:", `<div class="rej">
      <span class="et">Citas:</span><div class="campo">${citas.length}${citas.length ? ` (${fecha(citas[0])} – ${fecha(citas[citas.length - 1])})` : ""}</div>
    </div>`, {plegada: true}) +
  fs("Motivo de consulta:", `<div class="linea-motivo"><span class="icr">R</span>
      <div class="campo">${esc(dc.motivo || "")}</div><span class="ic az"></span></div>
    <div class="bajo-motivo"><span class="lupa"></span><span class="ic flecha">◀</span><span class="ic vd"></span></div>`) +
  fs("Antecedentes:", caja(de("DERIVACIONES_AP").map(f => `${MAYUS(f.campos.motivo)} — ${fecha(f.campos.fecha)}`).join("\n"), 86)) +
  fs("Historia actual:", caja([dc.observaciones || "", ...notas().map(texto_doc)].filter(Boolean).join("\n\n"), 190)) +
  fs("Constantes", `<div class="btns">
      <button class="btn">Nuevas ctes.</button><button class="btn">Consulta ctes.</button>
      <button class="btn">Balance hídrico</button><button class="btn">Antropometría</button>
      <button class="btn">Formulario de auxiliares</button></div>
    <div class="ctes">Sin constantes registradas en este episodio.</div>`) +
  fs("Exploración:", caja("", 72)) +
  fs("Escalas clínicas", `<div style="display:flex;align-items:center;gap:7px"><span class="lupa"></span>Seleccionar escala</div>`) +
  fs("Lista de problemas y orientación diagnóstica y terapéutica:", caja("", 92), {rojo: true}) +
  fs("Peticiones:", `<div class="pet-cab">
      <select class="sel"><option>Mis favoritos</option><option>Todas las peticiones</option></select>
      <span class="nuevo">📄+</span>
      <span class="iconos-pet"><span></span><span style="background:#2f2f2f;border-color:#111"></span>
        <span></span><span></span><span style="background:#f1c40f;border-color:#b7950b"></span></span>
    </div>
    <div class="favoritos">${FAVORITOS.map(f => `<span>${esc(f)}</span>`).join("")}</div>`) +
  fs("Pruebas complementarias:",
    fs("Laboratorio:", caja([ultimo_doc(/Analítica|Resultado de pruebas/), ...pruebas.filter(c => LABORATORIO.test(MAYUS(c.tipo))).map(linea)]
      .filter(Boolean).join("\n\n"), 120)) +
    fs("Imagen:", caja([ultimo_doc(/endoscopia|radiolog/i), ...pruebas.filter(c => IMAGEN.test(MAYUS(c.tipo)) || /ENDOSCOP/.test(MAYUS(c.tipo))).map(linea)]
      .filter(Boolean).join("\n\n"), 110)) +
    fs("Otros:", caja(pruebas.filter(c => !LABORATORIO.test(MAYUS(c.tipo)) && !IMAGEN.test(MAYUS(c.tipo))).map(linea).join("\n"), 60)));
}
/* los informes (DOCUMENTOS_HCE), si el servidor los tiene: el más reciente primero */
const docs = () => de("DOCUMENTOS_HCE").slice().sort((a, b) => String(b.campos.fecha).localeCompare(String(a.campos.fecha)));
const texto_doc = f => `[${fecha(f.campos.fecha)} · ${f.campos.tipo} · ${f.campos.autor}]\n${String(f.campos.texto || "").trim()}`;
const notas = () => docs().filter(f => /Nota de consulta|Nota de enfermería/.test(f.campos.tipo)).slice(0, 3);
const ultimo_doc = patron => { const f = docs().find(f => patron.test(f.campos.tipo)); return f ? texto_doc(f) : ""; };
function pintaDocs(){
  const d = docs();
  if (!d.length) return "";
  return fs(`Documentos clínicos (${d.length}):`, d.map(f => `<article class="doc" id="fila-${f.ref}">
      <div class="cab"><span>${fecha(f.campos.fecha)}</span><span class="t">${esc(f.campos.tipo)}</span>
        <span class="s">${esc(f.campos.servicio)}</span><span class="a">${esc(f.campos.autor)}</span></div>
      <pre>${esc(f.campos.texto)}</pre></article>`).join(""));
}
function pintaHistoria(){
  return titulo(`HISTORIA CLÍNICA · ${filas.length} registros`) + pintaDocs() + SECCIONES.map(([t, nombre]) => {
    const fs_ = de(t);
    return fs(`${nombre}:`, fs_.length ? tabla(t, fs_) : `<div class="vacia">Sin registros</div>`);
  }).join("");
}
function pintaPedidos(){
  const p = de("PRUEBAS");
  return titulo("PEDIDOS RECIENTES") + fs("Pruebas solicitadas:", p.length ? tabla("PRUEBAS", p) : `<div class="vacia">Sin pedidos</div>`);
}
function pintaOtra(nombre){
  return titulo(nombre.toUpperCase()) + fs(nombre, `<div style="color:#555">Pantalla no incluida en la maqueta. Los datos están en
      <b>Consulta</b>, <b>Historia Clínica</b> y <b>Pedidos Recientes</b>.</div>`);
}
function pinta(){
  const h = $("#hoja");
  if (!abierto) h.innerHTML = pintaAgenda();
  else if (!filas.length) h.innerHTML = titulo("CARGANDO HISTORIA CLÍNICA…");
  else h.innerHTML = vista === "consulta" ? pintaConsulta() : vista === "historia" ? pintaHistoria()
    : vista === "pedidos" ? pintaPedidos() : pintaOtra($(`.pest button[data-v="${vista}"]`).textContent.trim());
  h.querySelectorAll("legend").forEach(l => l.onclick = () => {
    const f = l.parentElement; f.classList.toggle("plegada");
    l.querySelector(".t").textContent = f.classList.contains("plegada") ? "▼" : "▲";
  });
  document.querySelectorAll(".pest button").forEach(t => t.setAttribute("aria-selected", String(t.dataset.v === vista)));
}
function iraFila(ref){
  if (vista !== "historia") { vista = "historia"; pinta(); }
  document.querySelectorAll("tr.sena, .doc.sena").forEach(x => x.classList.remove("sena"));
  const el = document.getElementById("fila-" + ref);
  if (el) { el.classList.add("sena"); el.scrollIntoView({block: "center"}); }
}

/* ---------- interacción ---------- */
document.querySelectorAll(".pest button").forEach(t => t.onclick = () => { vista = t.dataset.v; $("#hoja").scrollTop = 0; pinta(); });
$("#sel-pac").onchange = e => e.target.value ? abrePaciente(agenda.find(p => p.nhc === e.target.value)) : cierraPaciente();
$("#hoja").onclick = e => { const tr = e.target.closest(".agenda tr[data-nhc]"); if (tr) abrePaciente(agenda.find(p => p.nhc === tr.dataset.nhc)); };

// ?paciente=P0129798 (o ?paciente=primera) abre ese paciente al cargar: para la demo
const pedido = new URLSearchParams(location.search).get("paciente");
pinta();
cargaAgenda().then(() => {
  const p = pedido === "primera" ? agenda[0] : agenda.find(x => x.nhc === pedido);
  if (p) abrePaciente(p);
});
setInterval(cargaAgenda, 3000);                                   // con HL7 la agenda se va llenando
// y la historia cambia sola: se vuelve a pedir solo si ha llegado algo por HL7
let version = null;
setInterval(async () => {
  const v = await fetch("/api/hcis/version").then(r => r.json()).then(r => r.version).catch(() => null);
  if (v === null || v === version) return;
  const primera = version === null;
  version = v;
  if (abierto && !primera) { pintado = ""; cargaHistoria(); }
}, 2000);
</script>
<script>
// ?simulacion=1: la mañana de un médico, para el vídeo (mvp/simular.py)
if (new URLSearchParams(location.search).has("simulacion"))
  document.body.append(Object.assign(document.createElement("script"), {src: "simulacion.js"}));
</script>

</body>
</html>
