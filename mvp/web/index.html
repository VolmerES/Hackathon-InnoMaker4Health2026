<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCIS · Consultas externas</title>
<style>
/* Réplica sencilla de HCIS para los pacientes de los CSV sintéticos, con el
   estilo de demo/web/hcis.html. Hace de «HCIS»: no sabe nada de Medici. */
:root{--verde:#009b6b;--gris:#ececec;--borde:#c6c6c6;--rojo:#cc0000;--azul:#1a4fa0}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--gris);color:#000;font:12px/1.3 Verdana,Tahoma,Arial,sans-serif}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
.cinta{background:#fff;padding:3px 8px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-weight:bold;border-bottom:1px solid #ddd;min-height:22px}
.cinta .epi{color:#2a6ebb}
.cinta .fin{margin-left:auto;font-weight:normal;font-size:11px;color:#555}
.iconos{background:#fff;border-bottom:1px solid var(--borde);padding:2px 6px;display:flex;gap:5px}
.iconos .i{width:19px;height:18px;border-radius:2px}
.iconos .sep{width:1px;height:18px;background:#bbb;margin:0 4px}
.marco{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:0}
.izq{background:#fff;border-right:1px solid var(--borde);overflow:auto}
.verde{background:var(--verde);color:#fff;font-weight:bold;padding:5px 9px}
.cita{display:flex;gap:8px;width:100%;background:none;border:0;border-bottom:1px solid #eee;padding:7px 9px;text-align:left;cursor:pointer}
.cita:hover{background:#eef7f3}
.cita[aria-current="true"]{background:#d6ece3}
.cita .h{font-weight:bold;color:#2a6ebb;flex:0 0 auto}
.cita small{display:block;color:#666}
.der{display:flex;flex-direction:column;min-height:0}
.pest{display:flex;gap:3px;padding:3px 6px 0}
.pest span{background:#fff;border:1px solid var(--borde);border-bottom:0;border-radius:10px 10px 0 0;padding:5px 16px;color:var(--azul);text-decoration:underline}
.pest span.sel{color:#000;text-decoration:none;font-weight:bold}
.hoja{flex:1;min-height:0;overflow:auto;background:#fff;border-top:1px solid var(--borde);padding:8px 12px 16px}
.titulo{font-weight:bold;font-size:13px;margin:4px 0 12px}
fieldset{border:1px solid #d7d7d7;border-radius:9px;margin:0 0 12px;padding:8px 12px 10px}
legend{padding:0 6px;font-size:11.5px;color:#333}
legend b{color:var(--verde)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{background:#efefef;border:1px solid #d7d7d7;padding:4px 7px;text-align:left;font-weight:bold;color:#333;white-space:nowrap}
td{border:1px solid #e3e3e3;padding:4px 7px;vertical-align:top}
tr:nth-child(even) td{background:#fafafa}
td.r{color:#999;font-family:"Courier New",monospace;width:34px}
td .obs{display:block;margin-top:3px;color:#555;font:11px/1.45 "Courier New",monospace}
.est{display:inline-block;padding:0 6px;border-radius:3px;font-size:10.5px;font-weight:bold;background:#eee;color:#444}
.est.ok{background:#dff0e6;color:#1d6b3f}.est.mal{background:#f7dcdc;color:#a01b1b}.est.pend{background:#fbefcf;color:#7a5600}
.ficha{display:grid;grid-template-columns:max-content 1fr max-content 1fr;gap:6px 12px;align-items:center}
.ficha .et{color:#555}.ficha .v{border:1px solid #d2d2d2;border-radius:9px;background:#efefef;padding:2px 9px;min-height:21px}
.ficha .v.rojo{color:var(--rojo);font-weight:bold;background:#fff4f4;border-color:#e2b3b3}
.vacia{color:#888;font-style:italic}
.aviso{background:#fff8e1;border:1px solid #e8d48a;padding:6px 9px;margin-bottom:10px;font-size:11px;color:#6b5a1e}
</style>
</head>
<body>
<div class="app">
  <div class="cinta">
    <span class="nhc" id="c-nhc"></span>
    <span id="c-nombre"></span>
    <span id="c-datos"></span>
    <span>Episodio: <span class="epi">CEX · 24/10/2026</span></span>
    <span class="fin">HCIS · Consultas externas · réplica con datos sintéticos</span>
  </div>
  <div class="iconos">
    <span class="i" style="background:#b7c9e2"></span><span class="i" style="background:#9fd3a8"></span>
    <span class="sep"></span><span class="i" style="background:#e8dcc0"></span><span class="i" style="background:#cfd9e8"></span>
    <span class="sep"></span><span class="i" style="background:#f6e08a"></span><span class="i" style="background:#a9d9b4"></span>
  </div>
  <div class="marco">
    <aside class="izq">
      <div class="verde">Agenda de hoy</div>
      <div id="agenda"></div>
    </aside>
    <section class="der">
      <div class="pest"><span class="sel">Historia Clínica</span><span>Consulta</span><span>Pedidos Recientes</span><span>Prescripción</span></div>
      <div class="hoja" id="hoja"><p class="vacia">Elija un paciente de la agenda.</p></div>
    </section>
  </div>
</div>

<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const SECCIONES = [
  ["PACIENTES", "Datos del paciente"], ["DERIVACIONES_AP", "Derivaciones de Atención Primaria"],
  ["CITAS", "Citas"], ["MOVIMIENTOS_CITAS", "Cambios y cierres de citas"],
  ["PRUEBAS", "Pruebas"], ["COMUNICACIONES", "Avisos al paciente"]];
let agenda = [];

/* Cómo enseña HCIS cada tabla: columnas con nombre, fechas y estados. */
const ESP = {OFT:"Oftalmología", TRA:"Traumatología", DER:"Dermatología", CAR:"Cardiología", NRL:"Neurología", DIG:"Ap. digestivo"};
const fecha = v => { if (!v) return ""; const [d] = String(v).split(" "); const [a, m, dd] = d.split("-"); return dd ? `${dd}/${m}/${a}` : esc(v); };
const hora = v => v ? String(v).slice(0, 5) : "";
const bonito = v => esc(String(v ?? "").replaceAll("_", " ").toLowerCase().replace(/^./, c => c.toUpperCase()));
const estado = v => {
  const k = String(v || "");
  const clase = /^(REALIZADA|CITADA|ENTREGADO)$/.test(k) ? "ok" : /(NO_REALIZADA|ANULAD|FALLIDO|RECHAZADA)/.test(k) ? "mal"
              : /(PROGRAMADA|PENDIENTE|URGENTE|EN_REVISION|REPROGRAM)/.test(k) ? "pend" : "";
  return `<span class="est ${clase}">${bonito(k)}</span>`;
};
const COLUMNAS = {
  DERIVACIONES_AP: [["Fecha", c => fecha(c.fecha)], ["Destino", c => ESP[c.especialidad] || esc(c.especialidad)],
    ["Prioridad", c => bonito(c.prioridad)], ["Motivo", c => esc(c.motivo) + (c.observaciones ? `<span class="obs">${esc(c.observaciones)}</span>` : "")],
    ["Estado", c => estado(c.estado)]],
  CITAS: [["Fecha", c => fecha(c.fecha)], ["Hora", c => hora(c.hora)], ["Servicio", c => ESP[c.especialidad] || esc(c.especialidad || "")],
    ["Visita", c => ({P:"Primera", S:"Sucesiva"}[c.tipo_visita] || esc(c.tipo_visita || ""))], ["Prioridad", c => bonito(c.prioridad)],
    ["Estado", c => estado(c.estado)]],
  MOVIMIENTOS_CITAS: [["Fecha", c => fecha(c.fecha)], ["Cita", c => esc(c.cita || "")],
    ["Qué pasó", c => estado(c.tipo === "NO_REALIZADA" ? "NO_REALIZADA" : c.tipo)], ["Motivo", c => esc(c.motivo)]],
  PRUEBAS: [["Prueba", c => bonito(c.tipo)], ["Programada", c => fecha(c.programada)], ["Realizada", c => fecha(c.realizada)],
    ["Estado", c => estado(c.estado)], ["Resultado", c => c.resultado ? "Disponible" : "—"]],
  COMUNICACIONES: [["Fecha", c => fecha(c.fecha)], ["Canal", c => bonito(c.canal)], ["Aviso", c => bonito(c.motivo)],
    ["Cita", c => esc(c.cita || "")], ["Entrega", c => estado(c.resultado)], ["Respuesta", c => bonito(c.respuesta || "—")]],
};
function tabla_de(tabla, filas){
  const cols = COLUMNAS[tabla];
  return `<table><tr><th></th>${cols.map(([t]) => `<th>${t}</th>`).join("")}</tr>${filas.map(f =>
    `<tr><td class="r">${f.ref}</td>${cols.map(([, v]) => `<td>${v(f.campos)}</td>`).join("")}</tr>`).join("")}</table>`;
}
function ficha(c, p){
  return `<div class="ficha"><span class="et">Edad</span><span class="v">${c.edad} años</span>
    <span class="et">Sexo</span><span class="v">${p.sexo === "F" ? "Mujer" : "Varón"}</span>
    <span class="et">Contacto preferido</span><span class="v">${bonito(c.contacto)}</span>
    <span class="et">Accesibilidad</span><span class="v ${c.accesibilidad !== "NINGUNA" ? "rojo" : ""}">${bonito(c.accesibilidad)}</span></div>`;
}

let abierto = null, pintado = "";
async function abrePaciente(p){
  abierto = p; pintado = "";
  document.querySelectorAll(".cita").forEach(b => b.setAttribute("aria-current", String(b.dataset.nhc === p.nhc)));
  $("#c-nhc").textContent = p.nhc;
  $("#c-nombre").textContent = p.nombre.toUpperCase();
  $("#c-datos").textContent = `${p.sexo === "F" ? "Mujer" : "Varón"}, ${p.edad} años`;
  $("#hoja").innerHTML = `<p class="vacia">Cargando…</p>`;
  await pintaHistoria(p);
}
async function pintaHistoria(p){
  const r = await fetch(`/api/hcis/paciente/${encodeURIComponent(p.nhc)}`).then(r => r.json());
  if (p !== abierto || !r.filas) return;
  const clave = JSON.stringify(r.filas);
  if (clave === pintado) return;
  pintado = clave;
  const arriba = $("#hoja").scrollTop;
  $("#hoja").innerHTML = `<div class="titulo">HISTORIA CLÍNICA · ${esc(p.nombre)} · ${r.filas.length} registros</div>
    <div class="aviso">Nombre inventado para la demo. Los datos son de los CSV sintéticos del reto.</div>` +
    SECCIONES.map(([tabla, titulo]) => {
      const filas = r.filas.filter(f => f.tabla === tabla);
      return `<fieldset><legend><b>▲</b> ${titulo}${tabla === "PACIENTES" ? "" : ` (${filas.length})`}</legend>${filas.length
        ? (tabla === "PACIENTES" ? ficha(filas[0].campos, p) : tabla_de(tabla, filas))
        : `<div class="vacia">Sin registros</div>`}</fieldset>`;
    }).join("");
  $("#hoja").scrollTop = arriba;
}
setInterval(() => { if (abierto) pintaHistoria(abierto).catch(() => {}); }, 4000);

async function pintaAgenda(){
  const nueva = await fetch("/api/hcis/agenda").then(r => r.json()).catch(() => []);
  if (JSON.stringify(nueva) === JSON.stringify(agenda)) return;
  agenda = nueva;
  $("#agenda").innerHTML = agenda.length ? agenda.map(p => `<button class="cita" data-nhc="${p.nhc}"
    aria-current="${abierto && abierto.nhc === p.nhc}">
    <span class="h">${p.hora}</span><span>${esc(p.nombre)}<small>${p.nhc} · ${p.edad} años</small></span></button>`).join("")
    : `<p class="vacia" style="padding:8px">Agenda vacía: esperando datos de HCIS…</p>`;
}
$("#agenda").onclick = e => { const b = e.target.closest(".cita"); if (b) abrePaciente(agenda.find(p => p.nhc === b.dataset.nhc)); };
// ?paciente=P0129798 (o ?paciente=primera) abre ese paciente al cargar: para la demo
const pedido = new URLSearchParams(location.search).get("paciente");
pintaAgenda().then(() => {
  const p = pedido === "primera" ? agenda[0] : agenda.find(x => x.nhc === pedido);
  if (p) abrePaciente(p);
});
setInterval(() => { if (agenda.length < 8) pintaAgenda(); }, 3000);   // con HL7 la agenda se va llenando
</script>

<!-- Medici: en el hospital lo pondría la extensión del navegador; aquí, estas dos líneas -->
<link rel="stylesheet" href="pestana.css">
<script src="pestana.js"></script>
</body>
</html>
