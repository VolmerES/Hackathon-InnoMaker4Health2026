<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medicci · Mensajes HL7</title>
<link rel="stylesheet" href="/marca/medicci.css">
<style>
/* la identidad de Medicci, en su tema oscuro (marca/IDENTIDAD.md) */
*{box-sizing:border-box}
body{margin:0;background:#0B2F2B;color:#F6F1E6;font:13px/1.45 var(--sans)}
header{background:var(--verde-medicci);color:#F6F1E6;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #24524C}
header b{font:600 22px/1 var(--display);display:flex;align-items:center;gap:10px}
header b img{width:30px;height:30px}
header span{color:#BFD3CE;font-size:12px}
nav{margin-left:auto;display:flex;gap:14px}
nav a{color:var(--oro);font-size:12px;text-decoration:none}
nav a[aria-current]{color:#F6F1E6;font-weight:600}
main{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.m{background:#0E3B36;border:1px solid #24524C;border-radius:var(--radius-md);padding:8px 10px}
.m.nuevo{border-color:var(--oro);box-shadow:0 0 0 1px var(--oro)}
.cab{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tipo{font:500 13px var(--mono);color:#E2C25E}
.hora{color:#BFD3CE;font-size:11.5px}
.res{color:#F6F1E6}
.ack{margin-left:auto;color:#6FB3A6;font:500 11.5px var(--mono)}
pre{margin:6px 0 0;padding:6px 8px;background:#0B2F2B;border-radius:var(--radius-sm);overflow:auto;font:11.5px/1.5 var(--mono);color:#BFD3CE;white-space:pre}
.vacio{color:#BFD3CE}
</style>
</head>
<body>
<header><b><img src="/marca/isotipo.svg" alt="">Medicci · mensajes HL7 recibidos</b>
  <span>HCIS → motor de integración → Medicci (MLLP, puerto 2575) · Medicci solo lee y contesta ACK</span>
  <nav><a href="/?paciente=primera">HCIS · pacientes</a><a href="/hl7.html" aria-current="page">Mensajes HL7</a><a href="/registro.html">Registro de accesos</a></nav></header>
<main id="lista"><p class="vacio">Esperando mensajes… (python mvp/hl7_emisor.py)</p></main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ultimo = "";
async function pinta(){
  const ms = await fetch("/api/hl7/ultimos").then(r => r.json()).catch(() => []);
  if (!ms.length) return;
  const clave = ms[0].control + ms[0].hora;
  if (clave === ultimo) return;
  const nuevos = ultimo ? ms.findIndex(m => m.control + m.hora === ultimo) : 0;
  ultimo = clave;
  document.getElementById("lista").innerHTML = ms.map((m, i) => `<div class="m${i < nuevos ? " nuevo" : ""}">
    <div class="cab"><span class="tipo">${esc(m.tipo)}</span><span class="res">${esc(m.resumen)}</span>
      <span class="hora">${esc(m.hora)} · ${esc(m.control)}</span><span class="ack">ACK AA</span></div>
    ${i < 3 ? `<pre>${esc(m.texto.replace(/\r/g, "\n"))}</pre>` : ""}</div>`).join("");
}
pinta(); setInterval(pinta, 1500);
</script>
</body>
</html>
