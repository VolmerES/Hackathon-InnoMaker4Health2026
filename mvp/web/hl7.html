<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medicci · Mensajes HL7</title>
<style>
:root{--azul:#0f5b8f}
*{box-sizing:border-box}
body{margin:0;background:#0e1a24;color:#d7e3ec;font:13px/1.45 Verdana,Tahoma,Arial,sans-serif}
header{background:var(--azul);color:#fff;padding:10px 16px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
header b{font-size:15px;letter-spacing:.04em}
header span{color:#cfe2f1;font-size:12px}
nav{margin-left:auto;display:flex;gap:14px}
nav a{color:#f0c060;font-size:12px;text-decoration:none}
nav a[aria-current]{color:#fff;font-weight:bold}
main{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.m{background:#15263a;border:1px solid #24405e;border-radius:6px;padding:8px 10px}
.m.nuevo{border-color:#f0a020;box-shadow:0 0 0 1px #f0a020}
.cab{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tipo{font:bold 13px "Courier New",monospace;color:#f0c060}
.hora{color:#8ea6ba;font-size:11.5px}
.res{color:#fff}
.ack{margin-left:auto;color:#5fd38d;font:bold 11.5px "Courier New",monospace}
pre{margin:6px 0 0;padding:6px 8px;background:#0b1520;border-radius:4px;overflow:auto;font:11.5px/1.5 "Courier New",monospace;color:#b9cddc;white-space:pre}
.vacio{color:#8ea6ba}
</style>
</head>
<body>
<header><b>MEDICCI · mensajes HL7 recibidos</b>
  <span>HCIS → motor de integración → Medicci (MLLP, puerto 2575) · Medicci solo lee y contesta ACK</span>
  <nav><a href="/?paciente=primera">HCIS · pacientes</a><a href="/hl7.html" aria-current="page">Mensajes HL7</a><a href="/registro.html">Registro de accesos</a></nav></header>
<main id="lista"><p class="vacio">Esperando mensajes… (python mvp/hl7_emisor.py)</p></main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ultimo = "";
async function pinta(){
  const ms = await fetch("/api/hl7/ultimos").then(r => r.json()).catch(() => []);
  if (!ms.length) return;
  const clave = ms[0].control + ms[0].hora;
  if (clave === ultimo) return;
  const nuevos = ultimo ? ms.findIndex(m => m.control + m.hora === ultimo) : 0;
  ultimo = clave;
  document.getElementById("lista").innerHTML = ms.map((m, i) => `<div class="m${i < nuevos ? " nuevo" : ""}">
    <div class="cab"><span class="tipo">${esc(m.tipo)}</span><span class="res">${esc(m.resumen)}</span>
      <span class="hora">${esc(m.hora)} · ${esc(m.control)}</span><span class="ack">ACK AA</span></div>
    ${i < 3 ? `<pre>${esc(m.texto.replace(/\r/g, "\n"))}</pre>` : ""}</div>`).join("");
}
pinta(); setInterval(pinta, 1500);
</script>
</body>
</html>
